<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>安全撤退预警</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @keyframes flash {
    0%, 100% { background: rgba(239, 68, 68, 0.9); }
    50% { background: rgba(249, 115, 22, 0.9); }
  }
  @keyframes ring {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: flash 0.5s ease-in-out infinite;
    cursor: pointer;
    position: relative;
  }
  .ring {
    position: absolute; top: 50%; left: 50%;
    width: 200px; height: 200px;
    border: 6px solid rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: ring 1.5s ease-out infinite;
    pointer-events: none;
  }
  .ring:nth-child(2) { animation-delay: 0.5s; }
  .ring:nth-child(3) { animation-delay: 1s; }
  .text {
    font-size: 80px; font-weight: 900; color: white;
    text-shadow: 0 0 40px rgba(0,0,0,0.5);
    animation: bounce 0.5s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .sub {
    font-size: 24px; color: rgba(255,255,255,0.85);
    margin-top: 24px; z-index: 1;
    pointer-events: none;
  }
  .close-btn {
    position: fixed; top: 20px; right: 30px;
    z-index: 10;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 24px; font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    pointer-events: all;
  }
  .close-btn:hover {
    background: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
  <button class="close-btn" id="closeBtn" title="关闭">✕</button>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="text" id="alertText">⚡ 下班记得打卡！</div>
  <div class="sub">点击任意处或按 Esc 关闭</div>
  <script src="retreat-alert.js"></script>
</body>
</html>
